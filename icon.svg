<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    dsh-workbuddy-bridge 的插件页图标：与输入区那个「推理档位检测」控件**同一个字形**
    （src/client/probe-control.tsx 用宿主自己的 IconThinkOutlineRegular），放大到官方 36 格。

    **边距是关键，不是把墨迹拉满格**。量了宿主三个官方图标的内容范围：
      auto-review  上下 6 / 左右 8.5    voice-input  约 7.7 / 7.6    agent-team  上下 8.5–9.4 / 左右 9
    即内容落在离边 6–9 之间。本文件取 7：16 格的墨迹（外接框 0.6233–15.3767）落到 7–29。
      scale     = 22 / (15.3767 − 0.6233) = 1.4912
      translate = 7 − 0.6233 × 1.4912     = 6.0706
    原先写的是 translate(2 2) scale(2)（内容 2–34，四周只留 2）—— 看起来就是「太大、太挤」。

    线宽：组内给 1.5，落到画布约 2.24，与宿主「16 格里 1px」的视觉重量一致（1/16 × 36 = 2.25）。

    选色：图标是宿主直读的静态资源，**不跟随主题**，所以颜色只能烘死。
    墨迹 #7F8287（亮暗两块主题下都落在宿主中性色附近）；圆心那一点 #F59E0B
    （宿主 warn 档语义色，亮暗同值）—— 语义是「正在检测的那一档」。
    取色判据与 dsh-ds-balance 的 icon.svg 同一套。

    形状真源是宿主：组件直接渲染 IconThinkOutlineRegular，本文件是它按官方边距放大后的副本。
    宿主换字形时这里要同批跟（红线 test/redlines.spec.ts 对着三处路径逐字核）。
  -->
  <g transform="translate(6.0706 6.0706) scale(1.4912)">
    <g stroke="#7F8287" stroke-width="1.5" fill="none">
      <path d="M10.7554 5.24466C13.9891 8.4783 15.3769 12.3333 13.8552 13.8551C12.3335 15.3768 8.4785 13.989 5.24478 10.7553C2.01111 7.52165 0.623307 3.66664 2.14504 2.14491C3.66676 0.623189 7.52178 2.01099 10.7554 5.24466Z" />
      <path d="M10.7554 10.7553C7.52178 13.989 3.66676 15.3768 2.14504 13.8551C0.623307 12.3333 2.01111 8.4783 5.24478 5.24466C8.4785 2.01099 12.3335 0.623189 13.8552 2.14491C15.3769 3.66664 13.9891 7.52165 10.7554 10.7553Z" />
    </g>
    <!-- 圆心那一点：宿主原字形的第三条路径，填色而非描边，所以跟着同一组一起缩放。 -->
    <path d="M8.9587 8.00025C8.9587 8.52835 8.5306 8.95655 8.0024 8.95655C7.47429 8.95655 7.04614 8.52835 7.04614 8.00025C7.04614 7.47209 7.47429 7.04395 8.0024 7.04395C8.5306 7.04395 8.9587 7.47209 8.9587 8.00025Z" fill="#F59E0B" />
  </g>
</svg>
