<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    dsh-workbuddy-bridge 的插件页图标：与输入区那个「推理档位检测」控件**同一个字形**
    （src/client/probe-control.tsx 用的宿主义「思考」图标 IconThinkOutlineRegular），
    等比搬进官方 36 格。

    几何照宿主原名（viewBox 16 / 笔画 1）：两片对称的尖角弧围成一个透镜状的圈，圆心一点。
    它由两组相同的路径拼成，整组用 translate(2 2) 与 scale(2) 搬进 36 格 ——
    16 格 × 2 = 32，四周各留 2；笔画随之 ×2（1 → 2），与官方 36 格的线宽档一致。

    选色：图标是宿主直读的静态资源，**不跟随主题**，所以颜色只能烘死。
    墨迹用 #7F8287（宿主中性色附近的那个值，亮暗两块主题下都落在它附近）；
    圆心那一点用 #F59E0B（宿主 warn 档语义色，亮暗同值）—— 语义是「正在检测的那一档」。
    与 dsh-ds-balance 的 icon.svg 同一套取色判据（见其 .agents/notes/2026-09-22-plugin-icon.md）。

    形状真源是宿主：组件直接渲染 IconThinkOutlineRegular，本文件只是它放大后的复制。
    宿主换字形时这里要同批跟（红线 test/redlines.spec.ts 对着两处路径逐字核）。
  -->
  <g transform="translate(2 2) scale(2)" stroke="#7F8287" stroke-width="1" fill="none">
    <path d="M10.7554 5.24466C13.9891 8.4783 15.3769 12.3333 13.8552 13.8551C12.3335 15.3768 8.4785 13.989 5.24478 10.7553C2.01111 7.52165 0.623307 3.66664 2.14504 2.14491C3.66676 0.623189 7.52178 2.01099 10.7554 5.24466Z" />
    <path d="M10.7554 10.7553C7.52178 13.989 3.66676 15.3768 2.14504 13.8551C0.623307 12.3333 2.01111 8.4783 5.24478 5.24466C8.4785 2.01099 12.3335 0.623189 13.8552 2.14491C15.3769 3.66664 13.9891 7.52165 10.7554 10.7553Z" />
  </g>
  <circle cx="18" cy="18" r="2" fill="#F59E0B" />
</svg>
